# VGT run configuration.
#
# Parsed as TOML and loaded into the typed VGTConfig in src/config.jl. Modes are
# strings here; the loader validates them. Copy to config.toml and edit.

[input]
# FITS cube path.
input_file = "data/exp_raw/your_data.fits"

# Leave empty to use a DrWatson parameter-named run directory under data/sims/vgt/.
output_dir = ""

# Keep per-chunk JLD2 intermediates after the final products are written.
keep_intermediate_chunks = false

# Optional cube (same size) that sets the noise mask, the per-channel Stokes
# weights and the intensity map, while gradients come from input_file. Used for
# VGT on VDA velocity caustics (scripts/vda_velocity_caustics.jl).
# weight_file = ""

# Velocity window [lo, hi] in km/s: only channels whose centres lie inside it are
# used, exactly as if the cube were cut to them. Empty (default) = all channels.
# velocity_range_kms = [3.0, 7.0]

[noise]
# 1-sigma noise floor in data units. Estimate with scripts/analyze_inputs.jl
# (use its "Suggested config: noise = ..." line).
noise = 0.17

# Multiplier applied to the noise floor to get the mask threshold. For a
# conservative 3-sigma threshold, set noise to the 1-sigma estimate and this to 3.0.
noise_sigma_multiplier = 1.0

# Optional whitening of the gradient components (default off, output unchanged).
# Correlated, slightly anisotropic noise gives gradients a preferred direction
# that pulls each window's angle toward it. With gradient_whiten = true every
# gradient is mapped by C^(-1/2) (C = gradient_noise_cov scaled to unit
# determinant) and each window's angle is mapped back with C^(1/2).
# gradient_noise_cov = [sxx, syy, sxy] is the covariance of one gradient (data
# units per pixel) in emission-free channels, measured with the stencil of
# gradient_mode: scripts/analyze_inputs.jl cube.fits --noise-vrange=LO,HI prints
# the line to paste. Required when on, must be positive definite; gradient_mode
# central_checked or sobel_checked. Read docs/validation-gradient-whitening.md first.
#
# If the anisotropy changes across the map (direction or A), use a per-pixel
# covariance instead: gradient_noise_cov_file = "path.fits", a (nx, ny, 3) cube of
# sxx, syy, sxy on the input's sky grid. Build it with
# scripts/analyze_inputs.jl cube.fits --noise-vrange=LO,HI --cov-map=path.fits
# [--cov-fwhm=PX] (NaN-aware Gaussian smoothing, default FWHM 60 px = 3 x dn).
# Set one of the two, not both.
# gradient_whiten = false
# gradient_noise_cov = [0.25, 0.25, 0.0]
# gradient_noise_cov_file = ""

[vgt]
# Window size in pixels (even). Larger dn averages more gradients per window
# (smoother, less detail) and costs more RAM and compute per chunk.
dn = 20

# Gaussian smoothing sigma applied to the Q/U maps before computing the angle (pixels).
ker = 4

# Minimum valid above-threshold gradients required in a window before fitting.
min_valid = 100

# Frame of the written psi map. "pixel": counter-clockwise from the image x-axis
# (FITS axis 1), the frame VGT computes in. "galactic" or "icrs": IAU position
# angle, east of north in that frame, converted per pixel through the cube's WCS
# (needs celestial axes). Use "galactic" to compare with Planck.
angle_frame = "pixel"

# Output grid. 1 keeps the input grid (pixels then oversample the resolution,
# which is about dn pixels). b > 1 averages the smoothed Q/U/I over b x b input
# pixels, recomputes psi from them and scales the header WCS (CDELT x b); partial
# blocks at the right and top edges are dropped. Angles are never averaged.
output_bin = 1

# Opt-in edge mask (default false, output unchanged). true sets the direction to
# NaN at every pixel whose dn x dn window plus gradient stencil reaches a
# non-finite input pixel or the array border, so directions do not turn across
# a survey edge. See README.md (edge_mask).
# edge_mask = false

[execution]
# Number of y chunks: "auto" or a positive integer. Thread count is set when
# launching Julia (--threads=N or JULIA_NUM_THREADS).
ny_chunks = "auto"

# ---------------------------------------------------------------------------
# Advanced. Leave at the defaults unless validation on your cube supports a
# change; every value below except the defaults changes the science.
# Add these keys to the tables named in the comments.
# ---------------------------------------------------------------------------

# [noise]
# Threshold model:
#   "scalar"    the single noise value above (default)
#   "channel"   per-channel noise estimated inside each padded chunk
#   "spatial"   coarse spatial-tile noise estimated inside each chunk
#   "separable" spatial and channel estimates combined
#   "auto"      scalar/channel/spatial/separable chosen from sampled spread
# noise_mode = "scalar"
# noise_tile_size = 128   # tile size for "spatial", "separable" and "auto"

# [vgt]
# Window fitter. "axial_vonmises" (unbinned axial circular estimator) is the only one.
# fitter_mode = "axial_vonmises"

# Gradient stencil:
#   "central_checked"    default; central differences, all stencil pixels above threshold
#   "sobel_checked"      Sobel stencil
#   "isotropic_checked"  opt-in comparison; central differences with [1, 4, 1]/6 across them, which
#                        cancels the leading grid-locked angle term (docs/validation-angle-calibration.md)
#   "nan_edge_backward"  backward differences, first row/column invalid
# gradient_mode = "central_checked"

# Zero Q/U handling before smoothing:
#   "nan_before_smoothing"        default; zero Q/U is missing support
#   "keep_zero_before_smoothing"  keep zero Q/U through smoothing
# zero_stokes_policy = "nan_before_smoothing"

# Output support:
#   "smoothed_stokes_support"  default; includes the Gaussian support halo
#   "direct_fit_support"       blank pixels without a direct fitted window
# output_support_mode = "smoothed_stokes_support"

# Per-channel coherence weighting / gating. Keep disabled unless component-matched
# validation supports enabling them.
# rbar2_weight = false
# rbar2_gate = 0.0   # drop window fits with doubled-angle coherence below this; 0 disables
